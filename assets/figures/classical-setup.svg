<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#f4f6f8;stroke:#8a96a3;stroke-width:1.2}
      .in{fill:#e8f0fb;stroke:#5b84c4;stroke-width:1.2}
      .meet{fill:#fde9d4;stroke:#d9822b;stroke-width:1.8}
      .out{fill:#e9f5ea;stroke:#4f9a58;stroke-width:1.2}
      .t{fill:#222;text-anchor:middle}
      .s{fill:#666;text-anchor:middle;font-size:11px}
      .h{fill:#111;text-anchor:middle;font-size:14px;font-weight:bold}
      .l{stroke:#555;stroke-width:1.3;fill:none;marker-end:url(#arr)}
    </style>
  </defs>
  <rect width="960" height="250" fill="#ffffff"/>

  <text class="h" x="230" y="30">Features: address A vs address B, part by part</text>
  <text class="h" x="630" y="30">Classifier</text>

  <!-- features -->
  <rect class="meet" x="60" y="50" width="340" height="150" rx="5"/>
  <text class="t" x="230" y="80">Street: 7 similarity scores</text>
  <text class="t" x="230" y="106">House number: 7 similarity scores</text>
  <text class="t" x="230" y="132">ZIP: 8 similarity scores</text>
  <text class="t" x="230" y="158">+ flag: one side has no house number</text>
  <text class="s" x="230" y="180">Jaro-Winkler, Levenshtein, character overlap…</text>
  <text class="s" x="230" y="194">= 23 numbers per pair</text>

  <path class="l" d="M400,125 H548"/>

  <!-- classifier -->
  <rect class="box" x="550" y="70" width="160" height="110" rx="5"/>
  <text class="t" x="630" y="104">Logistic regression</text>
  <text class="t" x="630" y="130">Random forest</text>
  <text class="t" x="630" y="156">XGBoost</text>
  <text class="s" x="630" y="172">(one of the three)</text>

  <path class="l" d="M710,125 H778"/>
  <rect class="out" x="780" y="108" width="100" height="34" rx="5"/>
  <text class="t" x="830" y="130">P(match)</text>

  <rect class="meet" x="330" y="216" width="16" height="12" rx="2"/>
  <text x="352" y="227" fill="#444" font-size="12">= where A and B first interact</text>
</svg>
