<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#f4f6f8;stroke:#8a96a3;stroke-width:1.2}
      .in{fill:#e8f0fb;stroke:#5b84c4;stroke-width:1.2}
      .out{fill:#e9f5ea;stroke:#4f9a58;stroke-width:1.2}
      .t{fill:#222;text-anchor:middle;font-weight:bold;font-size:13px}
      .s{fill:#555;text-anchor:middle;font-size:11px}
      .m{fill:#555;text-anchor:middle;font-family:Menlo, Consolas, monospace;font-size:10.5px}
      .n{fill:#1c5cab;text-anchor:middle;font-size:12px;font-weight:bold}
      .l{stroke:#555;stroke-width:1.3;fill:none;marker-end:url(#arr)}
    </style>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>

  <!-- row 1 -->
  <rect class="in" x="20" y="20" width="270" height="110" rx="5"/>
  <text class="t" x="155" y="48">Two open datasets</text>
  <text class="s" x="155" y="72">Overture Maps places in Connecticut</text>
  <text class="s" x="155" y="90">Foursquare Open Source Places</text>

  <path class="l" d="M290,75 H333"/>
  <rect class="box" x="335" y="20" width="270" height="110" rx="5"/>
  <text class="t" x="470" y="48">Link with Overture's bridge files</text>
  <text class="s" x="470" y="72">each Overture place → its Foursquare record:</text>
  <text class="s" x="470" y="90">the same place, written by two sources</text>
  <text class="n" x="470" y="114">37,090 same-place pairs</text>

  <path class="l" d="M605,75 H648"/>
  <rect class="box" x="650" y="20" width="290" height="110" rx="5"/>
  <text class="t" x="795" y="48">Clean the addresses</text>
  <text class="s" x="795" y="70">strip suites, units and floors; punctuation → space</text>
  <text class="m" x="795" y="90">7 BACKUS AVE STE 101 → 7 BACKUS AVE</text>
  <text class="s" x="795" y="110">ZIP codes to 5 digits</text>
  <text class="m" x="795" y="124">6371 → 06371 · 06514-4033 → 06514</text>

  <!-- connector down to row 2 -->
  <path class="l" d="M795,130 V155 H125 V178"/>

  <!-- row 2 -->
  <rect class="box" x="20" y="180" width="210" height="110" rx="5"/>
  <text class="t" x="125" y="206">Split by ZIP code</text>
  <text class="s" x="125" y="228">train / validation / test;</text>
  <text class="s" x="125" y="244">no ZIP in two splits</text>
  <text class="n" x="125" y="270">228 / 47 / 56 ZIPs</text>

  <path class="l" d="M230,235 H258"/>
  <rect class="box" x="260" y="180" width="210" height="110" rx="5"/>
  <text class="t" x="365" y="206">Set aside doubtful pairs</text>
  <text class="s" x="365" y="228">two different house numbers:</text>
  <text class="s" x="365" y="244">probably a wrong match</text>
  <text class="n" x="365" y="270">1,778 removed</text>

  <path class="l" d="M470,235 H498"/>
  <rect class="box" x="500" y="180" width="210" height="110" rx="5"/>
  <text class="t" x="605" y="206">Remove duplicates</text>
  <text class="s" x="605" y="228">many businesses share one</text>
  <text class="s" x="605" y="244">building address (per split)</text>
  <text class="n" x="605" y="270">28,834 matches</text>

  <path class="l" d="M710,235 H738"/>
  <rect class="out" x="740" y="180" width="200" height="110" rx="5"/>
  <text class="t" x="840" y="206">Add non-matches</text>
  <text class="s" x="840" y="228">four kinds</text>
  <text class="s" x="840" y="244">(table below)</text>
  <text class="n" x="840" y="270">1 match : 9 non-matches</text>
</svg>
